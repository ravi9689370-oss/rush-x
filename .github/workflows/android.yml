name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    name: Capacitor debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (generates brand manifest + icon PNGs)
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # Note: ubuntu-latest runners ship with a preinstalled, license-accepted
      # Android SDK (ANDROID_HOME). android-actions/setup-android no longer
      # needed; it fails on the removed 'tools' package with cmdline-tools 16.
      - name: Ensure SDK licenses accepted
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Add & sync Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate launcher icon & splash from procedural SVG
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0B0914' --splashBackgroundColor '#0B0914'

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUSH-X-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
